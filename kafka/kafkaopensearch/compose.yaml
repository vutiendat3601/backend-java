name: kafkaopensearch
services:
  kafka-1:
    image: "apache/kafka:4.2.1"
    container_name: kafkaopensearch-kafka-1
    hostname: kafkaopensearch-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_NODE_ID: 1

      # Cluster
      CLUSTER_ID: abcdefghijklmnopqrstuvwxyz

      # KRaft
      KAFKA_PROCESS_ROLES: broker,controller # broker role
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafkaopensearch-kafka-1:29092,2@kafkaopensearch-kafka-2:29092 # List of controller join in voting leader.

      # Listeners
      # listeners=<listener_name>://<host>:<port>
      KAFKA_LISTENERS: CONTROLLER://:29092,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafkaopensearch-kafka-1:19092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafkaopensearch-kafka1-data:/var/lib/kafka/data

    networks:
      - default

  kafka-2:
    image: "apache/kafka:4.2.1"
    container_name: kafkaopensearch-kafka-2
    hostname: kafkaopensearch-kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_NODE_ID: 2

      # Cluster
      CLUSTER_ID: abcdefghijklmnopqrstuvwxyz

      # KRaft
      KAFKA_PROCESS_ROLES: broker,controller # broker role
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafkaopensearch-kafka-1:29092,2@kafkaopensearch-kafka-2:29092 # List of controller join in voting leader.

      # Listeners
      # listeners=<listener_name>://<host>:<port>
      KAFKA_LISTENERS: CONTROLLER://:29092,INTERNAL://:19092,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafkaopensearch-kafka-2:19092,EXTERNAL://localhost:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafkaopensearch-kafka2-data:/var/lib/kafka/data

    networks:
      - default

  kafka-ui:
    image: "provectuslabs/kafka-ui:latest"
    container_name: kafkaopensearch-kafka-ui
    hostname: kafkaopensearch-kafka-ui

    ports:
      - "7070:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafkaopensearch-kafka-1:19092,kafkaopensearch-kafka-2:19092

    depends_on:
      - kafka-1
      - kafka-2
    networks:
      - default

  opensearch:
    image: "opensearchproject/opensearch:3.7.0"
    container_name: kafkaopensearch-opensearch
    hostname: kafkaopensearch-opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node

      # Disable security for DEV
      - plugins.security.disabled=true

      # JVM heap size
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=$@sj6fl5k9jA1dlFJh231$1@s"

      # Allow CORS
      - http.cors.enabled=true
      - http.cors.allow-origin=*
    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "9200:9200" # REST API
      - "9600:9600" # Performance analyzer

    volumes:
      - kafkaopensearch-opensearch-data:/usr/share/opensearch/data
    networks:
      - default
  opensearch-dashboards:
    image: "opensearchproject/opensearch-dashboards:3.7.0"
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://kafkaopensearch-opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - default

volumes:
  kafkaopensearch-kafka1-data:
  kafkaopensearch-kafka2-data:
  kafkaopensearch-opensearch-data:

networks:
  default:
    name: kafkaopensearch-net
