name: wikimedia
services:
  kafka-1:
    image: "apache/kafka:4.2.1"
    container_name: wikimedia-kafka-1
    hostname: wikimedia-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_NODE_ID: 1

      # Cluster
      CLUSTER_ID: abcdefghijklmnopqrstuvwxyz

      # KRaft
      KAFKA_PROCESS_ROLES: broker,controller # broker role
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@wikimedia-kafka-1:29092,2@wikimedia-kafka-2:29092 # List of controller join in voting leader.

      # Listeners
      # listeners=<listener_name>://<host>:<port>
      KAFKA_LISTENERS: CONTROLLER://:29092,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://wikimedia-kafka-1:19092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - wikimedia-kafka1-data:/var/lib/kafka/data

    networks:
      - default

  kafka-2:
    image: "apache/kafka:4.2.1"
    container_name: wikimedia-kafka-2
    hostname: wikimedia-kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_NODE_ID: 2

      # Cluster
      CLUSTER_ID: abcdefghijklmnopqrstuvwxyz

      # KRaft
      KAFKA_PROCESS_ROLES: broker,controller # broker role
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@wikimedia-kafka-1:29092,2@wikimedia-kafka-2:29092 # List of controller join in voting leader.

      # Listeners
      # listeners=<listener_name>://<host>:<port>
      KAFKA_LISTENERS: CONTROLLER://:29092,INTERNAL://:19092,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://wikimedia-kafka-2:19092,EXTERNAL://localhost:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - wikimedia-kafka2-data:/var/lib/kafka/data

    networks:
      - default

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wikimedia-kafka-ui

    ports:
      - "7070:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: wikimedia-kafka-1:19092,wikimedia-kafka-2:19092

    depends_on:
      - kafka-1
      - kafka-2
    networks:
      - default

volumes:
  wikimedia-kafka1-data:
  wikimedia-kafka2-data:

networks:
  default:
    name: wikimedia-net
