services:
  prometheus:
    image: "prom/prometheus:v3"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - default
  grafana:
    image: "grafana/grafana:main-ubuntu"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - default

networks:
  default:
    name: prometheus-net
    driver: bridge